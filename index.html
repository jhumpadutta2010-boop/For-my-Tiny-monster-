<!DOCTYPE html>
<html>
  <head>
    <title>For Sir</title>
  </head>
  <style>
  .lock {
    font-size: 75px;
    margin-bottom: 25px;
}

.lock-screen h1 {
    font-size: 36px;
    margin-bottom: 18px;
}

.lock-screen p {
    font-size: 20px;
    opacity: 0.85;
    margin: 10px 0;
}

.lock-screen input {
    margin: 25px 0;
    padding: 16px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
}

.lock-screen button {
    padding: 15px 35px;
    border: none;
    border-radius: 30px;
    background: #4c8dff;
    color: white;
    font-size: 20px;
    cursor: pointer;
}
  
    .birthday-screen {
    min-height: 100vh;
    background: linear-gradient(135deg, #020617, #111b4d, #240046);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    overflow: hidden;
}

.birthday-screen h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.birthday-screen p {
    font-size: 18px;
    opacity: 0.85;
}
 .balloons {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.balloons span {
    position: absolute;
    font-size: 45px;
    animation: floatBalloon 5s ease-in-out infinite;
}

.balloons span:nth-child(1) {
    left: 10%;
    top: 15%;
}

.balloons span:nth-child(2) {
    left: 30%;
    top: 65%;
    animation-delay: 1s;
}

.balloons span:nth-child(3) {
    right: 15%;
    top: 20%;
    animation-delay: 2s;
}

.balloons span:nth-child(4) {
    right: 30%;
    top: 70%;
    animation-delay: 3s;
}

.balloons span:nth-child(5) {
    left: 50%;
    top: 10%;
    animation-delay: 1.5s;
}

@keyframes floatBalloon {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-25px);
    }
}   
.envelope-wrapper {
    position: relative;
    width: 260px;
    height: 300px;
    margin: 40px auto;
    cursor: pointer;
}

.envelope {
    position: absolute;
    bottom: 0;
    left: 10px;
    width: 240px;
    height: 160px;
    background: #d9b99b;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    z-index: 2;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
}

.letter {
    position: absolute;
    bottom: 35px;
    left: 25px;
    width: 210px;
    min-height: 230px;
    padding: 22px;
    box-sizing: border-box;
    background: white;
    color: #111;
    border-radius: 6px;
    font-family: Georgia, serif;
    text-align: left;
    z-index: 1;
    transform: translateY(0);
    transition: transform 1s ease;
}

.envelope-wrapper.open .letter {
  position: absolute;
  bottom: 35px;
  left: 25px;
  width: 210px;
  min-height: 230px;
  padding: 22px;
  box-sizing: border-box;
  background: white;
  colour: #111;
border-radius: 6px;
  font-family: georgia, serif;
  text-align: left;
  z-index: 1;
  transform: translateY(0);
  transition: transform 1s ease;
}
  .envelope-wrapper.open. letter {
    transform: transkateY(-170px);
  }
    .lock-screen {
    min-height: 100vh;
    background: #050816;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
}

.lock {
    font-size: 55px;
    margin-bottom: 20px;
}

.lock-screen h1 {
    font-size: 28px;
    margin-bottom: 12px;
}

.lock-screen p {
    font-size: 16px;
    opacity: 0.8;
}

.lock-screen input {
    margin: 20px 0;
    padding: 12px;
    border-radius: 8px;
    border: none;
}

.lock-screen button {
    padding: 12px 28px;
    border: none;
    border-radius: 25px;
    background: #4c8dff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
    
    </style>
  <body>
    <div class="lock screen">
       <div class="lock">🔐</div>
       <h1>A little something I made all by myself, just for you...</h1>
      <p>But first, prove its really you.</p>
    <p>Enter your date of birth to unlock it</p>
    <input type="date" id="dob">
    <button onclick="unlock()">unlock</button>
    <p id="error"></p
                    </div>
  <script>

function unlock() {
    const dob = document.getElementById("dob").value;

    if (dob === "2026-09-06") {
        showBirthday();
    } else {
        document.getElementById("error").textContent =
            "Hmm... that's not the right date. Try again.";
    }
}

function showBirthday() {
    document.querySelector(".lock-screen").style.display = "none";

    document.body.insertAdjacentHTML("beforeend",
        '<div class="birthday-screen">' +
            '<div class="balloons">' +
                '<span>🎈</span>' +
                '<span>🎈</span>' +
                '<span>🎈</span>' +
                '<span>🎈</span>' +
                '<span>🎈</span>' +
            '</div>' +

            '<div class="birthday-content">' +
                '<div class="sparkle">✨ 🎉 ✨</div>' +
                '<h1>🎉 Happy Birthday! 🎉</h1>' +
                '<p>Something special is waiting for you...</p>' +
                '<button onclick="goToEnvelope()">Next</button>' +
            '</div>' +
        '</div>'
    );
}

function goToEnvelope() {
    document.querySelector(".birthday-screen").innerHTML =
        '<div class="envelope-wrapper" onclick="openEnvelope()">' +

            '<div class="letter">' +
                '<h2>For you 💙</h2>' +
                '<p>Your birthday letter is waiting here...</p>' +
            '</div>' +

            '<div class="envelope">💌</div>' +

        '</div>' +

        '<p style="color: white; text-align: center;">' +
        'Tap the envelope 💌' +
        '</p>';
}

function openEnvelope() {
    document.querySelector(".envelope-wrapper").classList.add("open");
}

  </script>

  </body>
</html>
