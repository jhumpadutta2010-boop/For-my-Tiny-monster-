 .balloons {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.balloons span {
    position: absolute;
    font-size: 45px;
    animation: floatBalloon 5s ease-in-out infinite;
}

.balloons span:nth-child(1) {
    left: 10%;
    top: 15%;
}

.balloons span:nth-child(2) {
    left: 30%;
    top: 65%;
    animation-delay: 1s;
}

.balloons span:nth-child(3) {
    right: 15%;
    top: 20%;
    animation-delay: 2s;
}

.balloons span:nth-child(4) {
    right: 30%;
    top: 70%;
    animation-delay: 3s;
}

.balloons span:nth-child(5) {
    left: 50%;
    top: 10%;
    animation-delay: 1.5s;
}

@keyframes floatBalloon {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-25px);
    }
}
